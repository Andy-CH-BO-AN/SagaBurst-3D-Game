name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/publish.cjs --check
  validate:
    needs: inspect
    if: needs.inspect.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
      - run: node tools/release/validate-tag.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:web
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            flags: --win --x64
            executable: release/win-unpacked/SagaBurst.exe
          - os: macos-latest
            platform: macOS
            arch: arm64
            flags: --mac --arm64
            executable: release/mac-arm64/SagaBurst.app/Contents/MacOS/SagaBurst
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Enable long Windows asset paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:desktop -- ${{ matrix.flags }}
      - run: npm run smoke:desktop -- --packaged "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/SagaBurst-v*-*.zip
          if-no-files-found: error
  publish:
    needs: [inspect, validate, desktop]
    if: >-
      ${{ !cancelled() && needs.inspect.result == 'success' &&
          (needs.inspect.outputs.published == 'true' ||
           (needs.validate.result == 'success' && needs.desktop.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recheck main before publishing
        if: needs.inspect.outputs.published != 'true'
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          node tools/release/validate-tag.cjs
      - uses: actions/download-artifact@v4
        if: needs.inspect.outputs.published != 'true'
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Publish player downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/publish.cjs
