name: Finalize v1.1.0

on:
  push:
    branches:
      - release/v1.1.0-finalize

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.1.0
      RELEASE_RUN_ID: '37812785705'
      EXPECTED_MAIN_SHA: be3d11ff4d0aafc5728a2fbce0485d9c6d2f6dfe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated desktop artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RELEASE_RUN_ID }}
          pattern: desktop-*
          merge-multiple: true
          path: release

      - name: Verify and publish exact v1.1.0 draft
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          tag="$RELEASE_TAG"
          expected_windows="SagaBurst-v1.1.0-Windows-x64.zip"
          expected_macos="SagaBurst-v1.1.0-macOS-arm64.zip"

          main_sha="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$EXPECTED_MAIN_SHA"

          tag_type="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.type')"
          tag_object="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
          if [ "$tag_type" = "tag" ]; then
            tag_target="$(gh api "repos/$repo/git/tags/$tag_object" --jq '.object.sha')"
          else
            tag_target="$tag_object"
          fi
          test "$tag_target" = "$EXPECTED_MAIN_SHA"

          mapfile -t release_ids < <(
            gh api "repos/$repo/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .id"
          )
          test "${#release_ids[@]}" -eq 1
          release_id="${release_ids[0]}"

          release_json="$(gh api "repos/$repo/releases/$release_id")"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.assets | length' <<<"$release_json")" -eq 0

          for name in "$expected_windows" "$expected_macos"; do
            file="release/$name"
            test -s "$file"
            encoded_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$name")"
            curl --fail-with-body --location \
              --retry 3 --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/zip" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$repo/releases/$release_id/assets?name=$encoded_name" \
              > "/tmp/upload-$name.json"

            asset_json="$(gh api "repos/$repo/releases/$release_id" \
              --jq ".assets[] | select(.name == \"$name\")")"
            test "$(jq -r '.state' <<<"$asset_json")" = "uploaded"
            test "$(jq -r '.size' <<<"$asset_json")" -gt 0
            jq -e '.digest | test("^sha256:[a-f0-9]{64}$")' <<<"$asset_json" >/dev/null
          done

          final_draft="$(gh api "repos/$repo/releases/$release_id" \
            --method PATCH -F draft=false -F prerelease=false)"
          test "$(jq -r '.draft' <<<"$final_draft")" = "false"
          test "$(jq -r '.tag_name' <<<"$final_draft")" = "$tag"

          final_release="$(gh api "repos/$repo/releases/$release_id")"
          test "$(jq -r '.assets | length' <<<"$final_release")" -eq 2
          for name in "$expected_windows" "$expected_macos"; do
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$final_release")"
            test "$count" -eq 1
          done

      - name: Remove one-time finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-v1.1.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove completed v1.1.0 finalizer"
          git push origin HEAD:release/v1.1.0-finalize
