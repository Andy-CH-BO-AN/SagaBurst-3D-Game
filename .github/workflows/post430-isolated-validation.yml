name: Post-430 isolated regression verification (temporary)
on:
  push:
    branches: [fix/post-430-supercov-seed-recovery]
permissions:
  contents: read
jobs:
  targeted-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run four previously failing lightweight suites with normal 100ms budget
        run: |
          npm test -- \
            tests/persistence/CareerCommandAuthority.test.ts \
            tests/town/TownPatrolMovement.test.ts \
            tests/integration/PersonalSquadCommandRouting.test.ts \
            tests/actors/MountDeathPresentation.test.ts
