name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      mode:
        description: Logic test mode (manual validation always runs Full)
        type: choice
        options: [full]
        default: full
permissions:
  contents: read
concurrency:
  # A main commit owns publication, so each main push gets its own group and is
  # never cancelled by a later push; every other ref still supersedes older runs.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
jobs:
  logic:
    uses: ./.github/workflows/logic-tests.yml
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && 'full' || github.base_ref == 'main' && 'full' || github.ref == 'refs/heads/main' && 'full' || 'related' }}
      base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
      head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      event: ${{ github.event_name }}
  web:
    needs: logic
    # Preserve the existing required check: failed logic must fail web, not skip it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful logic gate
        env:
          LOGIC_RESULT: ${{ needs.logic.result }}
        run: test "$LOGIC_RESULT" = success
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash | bash -s -- 1.7.7 /tmp
          /tmp/actionlint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
      - run: npm run smoke:web
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
  desktop:
    needs: logic
    # PR artifacts validate packaging/smoke only. Logic cases execute once in the
    # Related gate; cross-platform Full/Node coverage is reserved for main/Release.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            flags: --win --x64
            executable: release/win-unpacked/SagaBurst.exe
          - os: macos-latest
            platform: macOS
            arch: arm64
            flags: --mac --arm64
            executable: release/mac-arm64/SagaBurst.app/Contents/MacOS/SagaBurst
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Explicit ad-hoc signing uses no certificate or signing secrets in PRs.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Enable long Windows asset paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:desktop -- ${{ matrix.flags }}
      - run: npm run smoke:desktop -- --packaged "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/SagaBurst-v*-*.zip
          if-no-files-found: error
  # push -> main is the single orchestrator for one Full gate. Pages and Release run
  # in this same workflow run, so they cannot race, reuse a PR run, or see a
  # different SHA; they start only after the Full logic gate and Web job succeed.
  pages:
    needs: [logic, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      # Require the same verified Full SHA proof as Release; fail closed if absent.
      logic-verified-sha: ${{ needs.logic.outputs.verified-sha }}
  release:
    needs: [logic, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      # Empty unless the aggregate verified a Full run for exactly this SHA; an
      # empty value makes Release run its own Full gate (fail closed).
      logic-verified-sha: ${{ needs.logic.outputs.verified-sha }}
