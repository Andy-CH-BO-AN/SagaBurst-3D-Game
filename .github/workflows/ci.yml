name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      mode:
        description: Logic test mode (manual validation always runs Full)
        type: choice
        options: [full]
        default: full
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  logic:
    uses: ./.github/workflows/logic-tests.yml
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && 'full' || github.base_ref == 'main' && 'full' || github.ref == 'refs/heads/main' && 'full' || 'related' }}
      base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
      head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      event: ${{ github.event_name }}
  web:
    needs: logic
    # Preserve the existing required check: failed logic must fail web, not skip it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful logic gate
        env:
          LOGIC_RESULT: ${{ needs.logic.result }}
        run: test "$LOGIC_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:web
  desktop:
    needs: logic
    # PR artifacts are validation downloads, never official GitHub Releases.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            flags: --win --x64
            executable: release/win-unpacked/SagaBurst.exe
          - os: macos-latest
            platform: macOS
            arch: arm64
            flags: --mac --arm64
            executable: release/mac-arm64/SagaBurst.app/Contents/MacOS/SagaBurst
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Explicit ad-hoc signing uses no certificate or signing secrets in PRs.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Enable long Windows asset paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Preserve platform Node checks unless the same-commit logic gate covered
      # the entire Node set; never replace missing coverage with a subset result.
      - run: npm run test:release
        if: needs.logic.outputs.node-release-covered != 'true'
      - run: npm run package:desktop -- ${{ matrix.flags }}
      - run: npm run smoke:desktop -- --packaged "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/SagaBurst-v*-*.zip
          if-no-files-found: error
