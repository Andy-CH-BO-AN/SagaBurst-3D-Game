name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main, codex/test-capability-audit]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:web
  desktop:
    # PR artifacts are validation downloads, never official GitHub Releases.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            flags: --win --x64
            executable: release/win-unpacked/SagaBurst.exe
          - os: macos-latest
            platform: macOS
            arch: arm64
            flags: --mac --arm64
            executable: release/mac-arm64/SagaBurst.app/Contents/MacOS/SagaBurst
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Explicit ad-hoc signing uses no certificate or signing secrets in PRs.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Enable long Windows asset paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run package:desktop -- ${{ matrix.flags }}
      - run: npm run smoke:desktop -- --packaged "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/SagaBurst-v*-*.zip
          if-no-files-found: error
