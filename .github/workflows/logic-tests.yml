name: Logic test gate
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      base:
        type: string
        default: ''
      head:
        type: string
        required: true
      event:
        type: string
        required: true
    outputs:
      # Non-empty only for a completed, aggregate-verified Full run whose manifest
      # was planned and checked out at exactly the requested head SHA.
      verified-sha:
        value: ${{ jobs.aggregate.outputs.verified-sha }}
# Read-only token permissions are inherited from caller CI workflow.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-tests: ${{ steps.plan.outputs.has-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify native selector contracts without gameplay
        run: node --test tests/release/ci-plan.test.cjs tests/release/supercov-related.test.cjs
      - name: Restore immutable Supercov Full evidence for Related
        if: inputs.mode == 'related'
        uses: actions/cache/restore@v4
        with:
          path: |
            .supercov/runs
            output/supercov-seed.json
          key: supercov-evidence-dev-${{ inputs.base }}
      - name: Restore ancestor evidence from cross-run artifact
        if: inputs.mode == 'related'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/tooling/supercov-evidence.cjs restore
      - name: Plan exact Supercov Related leaves
        id: plan
        env:
          TEST_MODE: ${{ inputs.mode }}
          TEST_BASE: ${{ inputs.base }}
          TEST_HEAD: ${{ inputs.head }}
          TEST_EVENT: ${{ inputs.event }}
        run: node tests/tooling/ci-plan.cjs --mode "$TEST_MODE" --base "$TEST_BASE" --head "$TEST_HEAD" --event "$TEST_EVENT" --out output/test-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: logic-plan
          path: output/test-plan.json
          if-no-files-found: error
          overwrite: true
  shard:
    needs: plan
    if: needs.plan.outputs.has-tests == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: logic-plan
          path: output
      - name: Run and validate shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: node tests/tooling/ci-run.cjs --manifest output/test-plan.json --shard "$TEST_SHARD" --out "output/shard-reports/$TEST_SHARD.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logic-${{ matrix.shard }}
          path: output/shard-reports/*.json
          if-no-files-found: error
          overwrite: true
  aggregate:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified-sha: ${{ steps.verified.outputs.sha }}
    steps:
      - name: Require successful plan and all shards
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          HAS_TESTS: ${{ needs.plan.outputs.has-tests }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$HAS_TESTS" = true ]; then test "$SHARD_RESULT" = success; else test "$SHARD_RESULT" = skipped; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: logic-plan
          path: output
      - name: Prepare reports directory (also for docs-only plans)
        run: mkdir -p output/shard-reports
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has-tests == 'true'
        with:
          pattern: logic-logic-*
          path: output/shard-reports
          merge-multiple: true
      - name: Verify complete, unique execution and aggregate budgets
        run: node tests/tooling/ci-run.cjs --manifest output/test-plan.json --reports output/shard-reports --out output/aggregate.json
      - name: Publish verified Full SHA for same-run reuse
        id: verified
        run: node tests/tooling/ci-run.cjs --verified-sha output/test-plan.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: logic-aggregate
          path: output/aggregate.json
          if-no-files-found: error
          overwrite: true

  # Full bootstrap only on main or explicitly dispatched manual Full.
  supercov-full-seed:
    needs: aggregate
    if: ${{ inputs.mode == 'full' && needs.aggregate.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: logic-plan
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: logic-aggregate
          path: output
      - name: Record strict Full seed from already-verified Full shards
        run: node tests/tooling/supercov-seed.cjs output/test-plan.json output/aggregate.json
      - name: Publish Full evidence for future Related selection
        uses: actions/cache/save@v4
        with:
          path: |
            .supercov/runs
            output/supercov-seed.json
          key: supercov-evidence-main-${{ github.sha }}
      - name: Create repository-wide evidence artifact
        run: tar -czf output/supercov-evidence.tar.gz .supercov/runs output/supercov-seed.json
      - uses: actions/upload-artifact@v4
        with:
          name: supercov-seed-${{ github.sha }}
          path: output/supercov-evidence.tar.gz
          if-no-files-found: error
          retention-days: 90

  # push -> dev is Related too: selected leaves only, no hidden Full.
  supercov-dev-refresh:
    needs: [plan, aggregate]
    if: ${{ inputs.mode == 'related' && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.aggregate.result == 'success' && needs.plan.outputs.has-tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore exact dev or latest main baseline seed
        uses: actions/cache/restore@v4
        with:
          path: |
            .supercov/runs
            output/supercov-seed.json
          key: supercov-evidence-dev-${{ inputs.base }}
      - name: Restore same ancestor seed including cross-run artifact fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/tooling/supercov-evidence.cjs restore
      - uses: actions/download-artifact@v4
        with:
          name: logic-plan
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: logic-aggregate
          path: output
      - name: Refresh selected Vitest evidence through Supercov public merge
        run: node tests/tooling/supercov-refresh.cjs output/test-plan.json output/aggregate.json output/supercov-seed.json
      - name: Publish next immutable dev evidence
        uses: actions/cache/save@v4
        with:
          path: |
            .supercov/runs
            output/supercov-seed.json
          key: supercov-evidence-dev-${{ github.sha }}
      - name: Create repository-wide Related evidence artifact
        run: tar -czf output/supercov-evidence.tar.gz .supercov/runs output/supercov-seed.json
      - uses: actions/upload-artifact@v4
        with:
          name: supercov-seed-${{ github.sha }}
          path: output/supercov-evidence.tar.gz
          if-no-files-found: error
          retention-days: 90
