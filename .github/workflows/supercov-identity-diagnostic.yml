name: Supercov 92-case exact native acceptance (temporary PR430)
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
  actions: read
jobs:
  exact-native:
    if: ${{ github.event.pull_request.head.ref == 'ci/supercov-per-test-impact-poc' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 3966b984204fb3d96ecb500d4bfc6cdd634f0d51
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install original exact-Full-seed dependencies
        run: npm ci
        working-directory: source
      - name: Restore historical real Full as read-only diagnostic input
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p native-acceptance-evidence source/output
          gh run download 42252456644 \
            --repo "$REPO" \
            --name supercov-seed-3966b984204fb3d96ecb500d4bfc6cdd634f0d51 \
            --dir native-acceptance-evidence
          tar -xzf native-acceptance-evidence/supercov-evidence.tar.gz -C source
          test -f source/output/supercov-seed.json
          test -d source/.supercov/runs/run_d06066084020ac43
      - name: Recover 92 true affected identities from 54-row preview and run exact normal Vitest
        run: node controller/tests/tooling/supercov-native-acceptance.cjs source
      - name: Save complete CLI and normal Vitest proof even if safety gate blocks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supercov-92-exact-native-${{ github.sha }}
          path: |
            native-acceptance-evidence/*.log
            native-acceptance-evidence/*.json
          if-no-files-found: warn
          retention-days: 45
