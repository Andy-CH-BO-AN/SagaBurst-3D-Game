name: Validate mount purchase fix
on:
  push:
    branches: [fix/career-hero-mount-purchases]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Check full-suite failures on fix
        run: npm test -- tests/EnemyTownAssault.test.ts tests/ShieldBlocking.test.ts --testTimeout=15000 --maxWorkers=2
      - name: Check out unchanged main
        if: always()
        uses: actions/checkout@v4
        with:
          ref: 122be9ece26bd3df06073447a2f1883067908f6f
          clean: false
      - name: Check same tests on unchanged main
        if: always()
        run: npm test -- tests/EnemyTownAssault.test.ts tests/ShieldBlocking.test.ts --testTimeout=15000 --maxWorkers=2
