name: Validate mount purchase fix
on:
  push:
    branches: [fix/career-hero-mount-purchases]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test -- tests/TownWeaponShop.test.ts tests/TownHub.test.ts
      - run: npm test
        if: always()
      - run: npm run build
        if: always()
